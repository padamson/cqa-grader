# The graphs cqa-grader is tested against, consumed as panschema packages
# from sibling checkouts. Each dataset is named as its package publishes
# it, never pathed into. `scripts/regen-fixtures.sh` runs this and records
# the siblings' versions; the Dogfood workflow runs it against their main
# branches.
[schemas.wine]
path = "../ontology-authoring-template"

[schemas.cqa]
path = "../cqa-schema"

[generate.wine]
ttl = "tests/fixtures/wine.ttl"
datasets = ["worked-example"]

[generate.cqa]
ttl = "tests/fixtures/wine-benchmark.ttl"
datasets = ["wine:benchmark"]

[check.cqa]
resolve_against = ["wine"]
require_namespace_coverage = true
