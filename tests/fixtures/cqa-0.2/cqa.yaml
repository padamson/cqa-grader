id: https://w3id.org/cqa/
name: cqa
description: |-
  A vocabulary for competency question benchmarks over a knowledge
  graph. One record pairs a question with the specification of its
  correct answer: the answer in prose and the values it states, the
  kind of answering the question demands, and the records a correct
  answer must retrieve and cite. The graph being evaluated is
  external — its records are referenced by IRI rather than held here.
license: https://creativecommons.org/licenses/by/4.0/
version: 0.2.0-dev
prefixes:
  linkml: https://w3id.org/linkml/
  cqa: https://w3id.org/cqa/
  obo: http://purl.obolibrary.org/obo/
  cco: https://www.commoncoreontologies.org/
  earl: http://www.w3.org/ns/earl#
  skos: http://www.w3.org/2004/02/skos/core#
  pav: http://purl.org/pav/
default_prefix: cqa
default_range: string
imports:
- linkml:types
classes:
  CompetencyQuestionAnswer:
    description: A competency question paired with the specification of its correct answer.
    subclass_of: cco:ont00000958
    close_mappings:
    - earl:TestCase
    slots:
    - id
    - name
    - question
    - ground_truth
    - answer_kind
    - expected_anchors
    - expected_citations
    - unconnected_anchors
    - connecting_class
    - expected_values
    - ordered_by
    slot_usage:
      id:
        key: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      expected_anchors:
        required: true
    rules:
    - description: A closed-world negative states the connection it claims is absent.
      preconditions:
        slot_conditions:
          answer_kind:
            equals_string: closed_world_negative
      postconditions:
        slot_conditions:
          unconnected_anchors:
            value_presence: PRESENT
    - description: An attribution names the source its answer rests on.
      preconditions:
        slot_conditions:
          answer_kind:
            equals_string: attribution
      postconditions:
        slot_conditions:
          expected_citations:
            value_presence: PRESENT
    - description: A comparison sets two or more records against each other.
      preconditions:
        slot_conditions:
          answer_kind:
            equals_string: comparison
      postconditions:
        slot_conditions:
          expected_anchors:
            minimum_cardinality: 2
    - description: A synthesis draws on two or more records, since a pattern no single record states needs more than one to state it.
      preconditions:
        slot_conditions:
          answer_kind:
            equals_string: synthesis
      postconditions:
        slot_conditions:
          expected_anchors:
            minimum_cardinality: 2
    - description: An ordered answer states two or more values to put in order.
      preconditions:
        slot_conditions:
          ordered_by:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          expected_values:
            minimum_cardinality: 2
  Benchmark:
    description: A named set of competency question answers, evaluated against one knowledge graph.
    subclass_of: cco:ont00000958
    close_mappings:
    - earl:TestRequirement
    tree_root: true
    slot_usage:
      id:
        identifier: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
    slots:
    - id
    - name
    - description
    - target_schema
    - target_schema_version
    - target_datasets
    - retrieval_budget
    - citation_precision_floor
    attributes:
      competency_question_answers:
        description: The questions this benchmark holds.
        range: CompetencyQuestionAnswer
        multivalued: true
        inlined_as_list: true
  TargetDataset:
    description: One instance graph a benchmark's anchors resolve in, at the version they were written against.
    subclass_of: cco:ont00000958
    slots:
    - dataset
    - version
  ExpectedValue:
    description: 'One value a correct answer states: a record of the target graph, one of its slots, and the value the record carries there.'
    subclass_of: cco:ont00000958
    slots:
    - record
    - slot
    - value
  DomainRecord:
    description: A record in the knowledge graph that a benchmark is evaluated against. Its instances belong to that graph, not to this schema.
    slots:
    - id
    slot_usage:
      id:
        identifier: true
slots:
  id:
    description: The short, stable identifier a record is known by.
  name:
    description: A short human-readable label.
  description:
    description: A longer prose account of what this benchmark covers.
  question:
    description: The competency question, in the words it would be asked in.
    required: true
  ground_truth:
    description: The correct answer in prose. A generated answer is scored against this; the anchors below are what retrieval is scored against.
    required: true
  answer_kind:
    description: The kinds of answering this question calls for. Every kind named is a separate check, and all of them must pass.
    range: AnswerKindEnum
    multivalued: true
    required: true
  expected_anchors:
    description: The records a correct answer must retrieve, as IRIs into the target graph. For an answer that reports no such record exists, these are the records whose absent connection is the answer, and reaching them is what distinguishes that answer from a system that retrieved nothing.
    range: DomainRecord
    multivalued: true
    annotations:
      expand_against: target_schema
  expected_citations:
    description: 'The records a correct answer must rest on, as IRIs into the target graph. Always among the anchors: retrieving a record is not the same as answering from it. Empty is a real answer.'
    is_a: expected_anchors
    range: DomainRecord
    multivalued: true
    annotations:
      expand_against: target_schema
  unconnected_anchors:
    description: 'The anchors that no single record joins, for an answer whose correctness is that the graph holds no such connection. A subset of the anchors: a claim about a record retrieval was never required to reach cannot be checked against what was retrieved. Records held by a container do not count as joined by it.'
    is_a: expected_anchors
    range: DomainRecord
    multivalued: true
    annotations:
      expand_against: target_schema
      asserts_absence:
        value:
          via_slot: connecting_class
  connecting_class:
    description: 'The class a joining record would belong to, as a URI in the target schema. Optional, because a benchmark can be written against a graph whose schema its author does not have: without it the claim is that no record of any kind joins the anchors, and with it the claim is narrowed to one kind.'
    range: uri
  expected_values:
    description: The values a correct answer states, each read from a record of the target graph. Every record named is among the anchors, since a value an answer depends on comes from a record the answer has to retrieve.
    range: ExpectedValue
    multivalued: true
    inlined_as_list: true
    annotations:
      asserts_value:
        value:
          record_slot: record
          slot_slot: slot
          value_slot: value
          among: expected_anchors
  ordered_by:
    description: The slot whose values order a correct answer, by the name the target schema gives it. A correct answer gives the records its expected values name at this slot in ascending order of those values, as the slot's range orders them. Records with equal values tie, and a correct answer may give tied records in any order.
  record:
    description: The record that carries the value, as an IRI into the target graph.
    range: DomainRecord
    required: true
    annotations:
      expand_against: target_schema
  slot:
    description: The slot that carries the value, by the name the target schema gives it.
    required: true
  value:
    description: The value, written as the target graph's data writes it and read by the range of the slot it is claimed at.
    required: true
  target_schema:
    description: The schema the target graph's records conform to, as a URI.
    range: uri
    required: true
  target_schema_version:
    description: 'The version of the target schema the anchors were written against: the release identifier of whatever publishes the schema, which can differ from the version the schema file declares. It fixes how identifiers are minted, which can change between releases.'
    required: true
    annotations:
      records_version_of:
        value:
          sibling_slot: target_schema
  target_datasets:
    description: The instance graphs the anchors resolve in. One schema can have several, they need not hold the same records, and one question's anchors can lie in more than one, so naming the schema and its version does not identify them.
    range: TargetDataset
    multivalued: true
    inlined_as_list: true
    required: true
  dataset:
    description: 'Which instance graph, named as the target package publishes it: a dataset name from that package''s publish manifest.'
    required: true
  version:
    description: 'The version of the dataset the anchors were written against: the release identifier of whatever publishes it, which is the schema''s own version when the two ship together. It fixes which records exist, since records can be added, corrected or removed without the schema changing.'
    slot_uri: pav:version
    required: true
    annotations:
      records_version_of:
        value:
          sibling_slot: dataset
  retrieval_budget:
    description: The most records a correct answer may retrieve for any one question. A question with more anchors than this could not be answered within it, so none may have more.
    range: integer
    minimum_value: 1
    annotations:
      bounds_count_of:
        value:
          counted_slot: expected_anchors
  citation_precision_floor:
    description: The least share of the records an answer cites that must be among its question's anchors. An answer that cites nothing is not held to it.
    range: float
    minimum_value: 0
    maximum_value: 1
enums:
  AnswerKindEnum:
    description: The kinds of answering a competency question can call for. Each names a different check on a correct answer.
    permissible_values:
      lookup:
        description: A value read from a single record.
      closed_world_negative:
        description: The correct answer is that the graph holds no such record. Absence of a record is not evidence against the claim, only absence of a claim for it.
      comparison:
        description: Two or more records set against each other on a shared slot.
      synthesis:
        description: A pattern across several records that no single record states.
      attribution:
        description: An answer that must carry the source it rests on. The question is answerable without it, but not answerable well.
