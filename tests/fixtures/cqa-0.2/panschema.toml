# cqa's schema alone, merged, for the tests of cqa 0.2's benchmark shape.
# The graphs one directory up are generated with wine's benchmark, which is
# written in cqa 0.1's shape and fails `generate --strict` against cqa's
# main until wine moves to 0.2; this manifest generates without it. Once
# wine's benchmark is in the 0.2 shape, ../cqa.yaml is the same schema, and
# this directory goes in the commit that regenerates the graphs and drops
# the reading of cqa 0.1 along with its tests.
[schemas.cqa]
path = "../../../../cqa-schema"

[generate.cqa]
linkml_schema = "cqa.yaml"
