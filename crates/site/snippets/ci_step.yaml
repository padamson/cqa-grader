# In a benchmark's own CI: the baseline shows every record an answer needs
# can be found. It never says "none on record", so grading exits 1 on a
# benchmark with a closed-world negative, until grading can require only
# that there be no wrong answers (see the roadmap). --dataset and
# --dataset-version name the graph as the benchmark's target does; they
# move with each release, or grading exits 2.
- name: Grade the baseline against the benchmark
  run: |
    cqa-grader baseline --graph site/artifacts/wine.ttl \
      --dataset worked-example --dataset-version 0.2.1 \
      --benchmark site/artifacts/wine-benchmark.ttl --output trace.json
    cqa-grader grade --benchmark site/artifacts/wine-benchmark.ttl \
      --trace trace.json --report report.json
