# In a benchmark's own CI: the baseline shows every record an answer needs
# can be found. It never says "none on record", so it leaves a closed-world
# negative unanswered; --require no-wrong-answers tolerates that and still
# fails a wrong answer or a question not attempted. --dataset and
# --dataset-version name the graph as the benchmark's target does; they
# move with each release, or grading exits 2.
- name: Grade the baseline against the benchmark
  run: |
    cqa-grader grade --benchmark site/artifacts/wine-benchmark.ttl \
      --baseline --graph site/artifacts/wine.ttl \
      --dataset worked-example --dataset-version 0.2.1 \
      --require no-wrong-answers --report report.json
