# Standalone (its own `[workspace]` table): a wasm32 Leptos CSR crate built
# by Trunk, not part of the published crate. Keeping it out of the root
# package leaves `cargo build/clippy/nextest` and the supply-chain graph
# for cqa-grader untouched; its own `Cargo.lock` is committed. Run cargo
# here with `--manifest-path crates/site/Cargo.toml`.
[package]
name = "cqa-grader-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Paul Adamson"]
repository = "https://github.com/padamson/cqa-grader"
publish = false

[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# Fetch versions.json and main's roadmap at runtime, so a deployed snapshot
# can list versions released after it was built. `http` only.
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"

# Build-time only: highlight code snippets to HTML so nothing is shipped to
# the WASM bundle. `default-fancy` swaps the C oniguruma regex for pure-Rust
# fancy-regex.
[build-dependencies]
syntect = { version = "5.2", default-features = false, features = [
    "default-fancy",
] }
