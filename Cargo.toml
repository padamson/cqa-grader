[package]
name = "cqa-grader"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Grades a system's retrieval trace or answer against a cqa competency-question-answer benchmark"
repository = "https://github.com/padamson/cqa-grader"
authors = ["Paul Adamson"]
categories = ["command-line-utilities", "development-tools::testing"]
keywords = ["knowledge-graph", "benchmark", "rdf", "evaluation", "linkml"]

[[bin]]
name = "cqa-grader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Same feature set panschema uses: in-memory store only (no rocksdb), and
# `rdf-12` so the sub-crates agree on the term model.
oxigraph = { version = "0.5.9", default-features = false, features = ["rdf-12"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
