# cargo-deny configuration
# Run: cargo deny --workspace check bans licenses sources
# Advisories go through cargo-lockpatrol instead (`prek run cargo-lockpatrol
# --all-files`), which reads [advisories] below for every tracked Cargo.lock.
# Plain `cargo deny check` reads the root lockfile alone, so it disagrees
# with the gate about an ignore entry that only crates/site's tree uses.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# The only list of accepted RUSTSEC advisories. CI, the pre-commit hook
# and the daily advisory monitor all run cargo-lockpatrol, which reads it
# here, so nothing mirrors this list and nothing can drift from it.
ignore = [
    # quick-xml 0.37 via oxigraph's RDF/XML reader and SPARQL results
    # parsers; this crate reads Turtle only. Retire when oxigraph moves
    # to quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # crates/site only, and only at compile time; none reaches the WASM
    # bundle. All three are unmaintained notices with no safe upgrade.
    # paste: a proc-macro leptos uses. Retire when leptos drops it.
    "RUSTSEC-2024-0436",
    # bincode 1.3.3 and yaml-rust: syntect, a build-dependency that
    # highlights code snippets in build.rs; bincode decodes its bundled
    # syntax and theme dumps, and yaml-rust comes with its `yaml-load`
    # feature, which build.rs never uses. Retire when syntect drops them.
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0320",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
