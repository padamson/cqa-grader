name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      # If your crate uses `include_bytes!` against build-generated
      # artifacts (wasm pkgs, codegen output, etc.), stub them with
      # `touch` here so `cargo check` succeeds — the bytes aren't
      # exercised at compile time, only their existence on disk is.
      - name: Check compilation on MSRV
        run: cargo check --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.26
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --verbose

      # --- Test graphs: generated from sibling packages with panschema ---
      # panschema.toml consumes wine and cqa as `path:` siblings (neither
      # has a release containing the benchmark yet), so CI provides the
      # siblings the way a local co-development checkout does, and
      # installs panschema from its main HEAD SHA so drift surfaces here.

      - name: Check out sibling packages (wine, cqa)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/padamson/ontology-authoring-template ../ontology-authoring-template
          git clone --depth 1 https://github.com/padamson/cqa-schema ../cqa-schema

      - name: Resolve latest panschema main SHA
        id: panschema
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/padamson/panschema/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache panschema binary
        id: cache-panschema
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/panschema*
          key: panschema-bin-${{ runner.os }}-${{ steps.panschema.outputs.sha }}

      - name: Install wasm-pack (panschema build prerequisite)
        if: steps.cache-panschema.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install panschema from main
        if: steps.cache-panschema.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --git https://github.com/padamson/panschema \
            --rev ${{ steps.panschema.outputs.sha }} \
            --locked --force \
            panschema

      - name: Generate test graphs
        run: panschema generate --strict

      - name: Run tests
        run: cargo nextest run --workspace
