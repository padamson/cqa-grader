name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      # If your crate uses `include_bytes!` against build-generated
      # artifacts (wasm pkgs, codegen output, etc.), stub them with
      # `touch` here so `cargo check` succeeds — the bytes aren't
      # exercised at compile time, only their existence on disk is.
      - name: Check compilation on MSRV
        run: cargo check --workspace

      - name: Check the site crate on MSRV
        run: cargo check --manifest-path crates/site/Cargo.toml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  # The site crate has its own [workspace], so no --workspace command above
  # reaches it. Its tests hold crates/site/public/roadmap.json to its types and
  # every done item to tests that exist.
  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/site

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.26
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --manifest-path crates/site/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path crates/site/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run --manifest-path crates/site/Cargo.toml

  # The architecture model (docs/architecture/model.c4) is generated by
  # asbuilt; the action installs the release asbuilt.toml pins and runs
  # `asbuilt check`, which fails with a diff when the model is stale.
  architecture:
    name: Architecture model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install asbuilt and check the architecture model
        uses: padamson/asbuilt@83d374bc3d98f5d1cb893944777c3a10e66fd6d2 # v0.3.0

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.26
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --verbose

      # The test graphs are the committed tests/fixtures/*.ttl; the Dogfood
      # workflow regenerates them from the producers' main branches.
      - name: Run tests
        run: cargo nextest run --workspace
