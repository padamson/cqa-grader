name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      # If your crate uses `include_bytes!` against build-generated
      # artifacts (wasm pkgs, codegen output, etc.), stub them with
      # `touch` here so `cargo check` succeeds — the bytes aren't
      # exercised at compile time, only their existence on disk is.
      - name: Check compilation on MSRV
        run: cargo check --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.4
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo nextest run --workspace
