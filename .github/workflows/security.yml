name: Security & Quality

# The jobs are shared workflows in padamson/rust-ci-workflows, pinned by SHA
# so Dependabot's github-actions entry moves them. Each check reports as
# `<job id here> / <job name there>`, the names main's branch protection
# requires. The local half (deny.toml, supply-chain/, .cargo/mutants.toml,
# the prek hooks) stays in this repo, and release.yml calls the same
# `supply-chain.yml` at the same pin on a release tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Saturday 5am ET
    - cron: '0 9 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # cargo deny (bans, licenses, sources), cargo-lockpatrol's advisory check
  # over every tracked Cargo.lock against deny.toml's one ignore list, and
  # cargo vet. crates/site is outside the workspace and keeps its own
  # lockfile, so deny checks it separately; vet covers the workspace only.
  # `advisory-monitor.yml` runs the same advisory check daily, to catch
  # advisories published between pushes.
  supply-chain:
    uses: padamson/rust-ci-workflows/.github/workflows/supply-chain.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0
    with:
      deny-manifests: crates/site

  # Not a required check: the early signal for release.yml's semver gate,
  # which runs only on the tag. Between releases Cargo.toml still carries
  # the last released version, so on 0.x a deliberate break turns it red
  # until the release that bumps the version. It also saves the cache the
  # gate restores.
  semver-preview:
    uses: padamson/rust-ci-workflows/.github/workflows/semver-preview.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0

  # The per-diff run on push and pull request, the full sweep on dispatch.
  # The full sweep outgrows a job's timeout, so the schedule skips it. CI
  # runs `cargo mutants --in-diff` itself, not `scripts/mutants.sh`, so a
  # stub the build needs goes in `with: setup:` here.
  mutation:
    if: github.event_name != 'schedule'
    uses: padamson/rust-ci-workflows/.github/workflows/mutation.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0
