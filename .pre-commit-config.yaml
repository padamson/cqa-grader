# Pre-commit hooks for Rust projects
# Install: cargo install prek && prek install
# Run manually: prek run

fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: mixed-line-ending
        name: Fix mixed line endings

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Auto-format Rust code
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run clippy linter
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check Rust code compiles
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-nextest
        name: cargo nextest run
        description: Run tests with nextest
        entry: cargo nextest run --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # The site crate is outside the workspace, so the root fmt, clippy and
      # nextest hooks miss it; this runs the CI Site job's three steps. Its
      # tests read the sources a done item's criteria name, which can be any
      # .rs file. fmt fixes, as the root hook does. clippy is `--locked`
      # (CI is not), so a stale lockfile fails with cargo's message instead
      # of being rewritten mid-commit.
      - id: site-tests
        name: site tests
        description: fmt, clippy and tests for the site crate
        entry: >-
          bash -c 'cargo fmt --manifest-path crates/site/Cargo.toml
          && cargo clippy --manifest-path crates/site/Cargo.toml --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
          && cargo nextest run --manifest-path crates/site/Cargo.toml'
        language: system
        files: (\.rs$|^crates/site/)
        pass_filenames: false

      - id: cargo-doctest
        name: cargo test --doc
        description: Run documentation tests
        entry: cargo test --doc --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # cargo deny checks licenses, bans and sources. Advisories go
      # through cargo-lockpatrol, the hook at the end of this file, the
      # same checker as the CI gate and the monitor, which reads every
      # tracked Cargo.lock and the one ignore list in `deny.toml`.
      # Both are diff-gated on purpose (cargo-lockpatrol's `files:` comes
      # from its own .pre-commit-hooks.yaml): an advisory published
      # overnight should not block an unrelated commit; the scheduled
      # advisory-monitor workflow catches those.
      - id: cargo-deny
        name: cargo deny
        description: Check licenses, bans, and source restrictions
        entry: cargo deny --workspace check bans licenses sources
        language: system
        pass_filenames: false
        files: (Cargo\.toml|Cargo\.lock|deny\.toml)$

      # The same check on crates/site, which CI's deny job runs through
      # `deny-manifests`. Locked, unlike CI, so a stale lockfile fails with
      # cargo's message instead of being rewritten mid-commit.
      - id: cargo-deny-site
        name: cargo deny (site)
        entry: cargo deny --locked --workspace --config deny.toml --manifest-path crates/site/Cargo.toml check bans licenses sources
        language: system
        pass_filenames: false
        files: ^(crates/site/Cargo\.(toml|lock)|deny\.toml)$

      - id: cargo-vet
        name: cargo vet
        description: Verify dependency supply chain audits
        entry: cargo vet
        language: system
        pass_filenames: false
        files: (Cargo\.toml|Cargo\.lock)$|^supply-chain/

  # `rev` picks the hook definition; the binary is the release asbuilt.toml pins.
  - repo: https://github.com/padamson/asbuilt
    rev: v0.4.0
    hooks:
      - id: asbuilt-check

  # Builds the binary at the pinned rev (prek runs `cargo install`), so
  # the hook is the release the CI gate and the monitor run. Needs
  # cargo-deny on PATH. Dependabot's pre-commit entry moves this rev.
  - repo: https://github.com/padamson/cargo-lockpatrol
    rev: e791845e4a03af540c2348755c3695041cdd54fd  # frozen: v0.2.0
    hooks:
      - id: cargo-lockpatrol
